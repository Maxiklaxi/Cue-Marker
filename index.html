<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ========== Main view ========== -->
  <div id="viewMain" class="view active">
    <div class="toolbar">
      <span class="toolbar-title">Cue Marker</span>
      <span class="toolbar-count" id="listCount"></span>
      <div class="toolbar-right">
        <div class="update-pill" id="btnUpdate" style="display:none" data-i18n-title="update.title">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v7M3 5.5 6 8.5l3-3M2 10.5h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="updateLabel"></span>
        </div>
        <div class="tool-btn" id="btnLog" data-i18n-title="opt.debug">
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M2 6h8M2 9h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="tool-btn" id="btnSettings" data-i18n-title="settings">
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M10.18 5 L11.53 5.12 L11.53 6.88 L10.18 7 A4.3 4.3 0 0 1 9.67 8.25 L10.53 9.29 L9.29 10.53 L8.25 9.67 A4.3 4.3 0 0 1 7 10.18 L6.88 11.53 L5.12 11.53 L5 10.18 A4.3 4.3 0 0 1 3.75 9.67 L2.71 10.53 L1.47 9.29 L2.33 8.25 A4.3 4.3 0 0 1 1.82 7 L0.47 6.88 L0.47 5.12 L1.82 5 A4.3 4.3 0 0 1 2.33 3.75 L1.47 2.71 L2.71 1.47 L3.75 2.33 A4.3 4.3 0 0 1 5 1.82 L5.12 0.47 L6.88 0.47 L7 1.82 A4.3 4.3 0 0 1 8.25 2.33 L9.29 1.47 L10.53 2.71 L9.67 3.75 A4.3 4.3 0 0 1 10.18 5 Z M8.3 6 A2.3 2.3 0 0 0 3.7 6 A2.3 2.3 0 0 0 8.3 6 Z" fill="currentColor" fill-rule="evenodd"/></svg>
        </div>
      </div>
    </div>

    <div class="list-scroll" id="listScroll">
      <div class="empty" id="empty" data-i18n="empty"></div>
      <div class="list" id="list"></div>
    </div>

    <div class="log-wrap" id="logWrap">
      <div class="log-bar">
        <span class="log-title">Log</span>
        <div class="tool-btn" id="btnCopy" data-i18n-title="btn.copy">
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><rect x="4" y="4" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 4V1.5H1.5V8H4" stroke="currentColor" stroke-width="1.6"/></svg>
        </div>
        <div class="tool-btn" id="btnClear" data-i18n-title="btn.clear">
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="bottom-row">
      <div class="status-strip status-idle" id="statusStrip">
        <span class="status-dot">
          <svg width="10" height="10" viewBox="-1 -1 10 10" fill="none">
            <polygon class="st-line" points="4,0.9 7.1,4 4,7.1 0.9,4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <polygon class="st-fill" points="4,0.9 7.1,4 4,7.1 0.9,4" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="status-text" id="statusText"></span>
      </div>
      <div class="bottom-divider"></div>
      <div class="btn" id="btnPreview"><span data-i18n="btn.preview"></span></div>
      <div class="bottom-divider"></div>
      <div class="btn btn-go" id="btnRun">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2L4.5 13.5H12L11 22L19.5 10.5H12L13 2Z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="btn.run"></span>
      </div>
    </div>
  </div>

  <!-- ========== Settings ========== -->
  <div id="viewSettings" class="view">
    <div class="settings-header" id="btnBack">
      <span class="settings-title">Cue Marker</span>
      <span class="settings-sub" data-i18n="settings"></span>
      <div class="close-btn">
        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="settings-scroll">
      <div class="section">
        <div class="section-title" data-i18n="sec.markers"></div>
        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.prefix"></div>
            <div class="setting-hint" data-i18n="opt.prefix.hint"></div>
          </div>
          <div class="oc-field"><input type="text" class="oc-field-input" id="optPrefix" value="Mark" spellcheck="false"></div>
        </div>
        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.color"></div>
            <div class="setting-hint" data-i18n="opt.color.hint"></div>
          </div>
        </div>
        <div class="swatches" id="colorRow"></div>
        <div class="setting-row" data-opt="skipDup">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.skipDup"></div>
            <div class="setting-hint" data-i18n="opt.skipDup.hint"></div>
          </div>
          <div class="tool-btn toggle" id="optSkipDup"></div>
        </div>
        <div class="setting-row" data-opt="fileComment">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.fileComment"></div>
            <div class="setting-hint" data-i18n="opt.fileComment.hint"></div>
          </div>
          <div class="tool-btn toggle" id="optFileComment"></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title" data-i18n="sec.report"></div>
        <div class="setting-row" data-opt="report">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.report"></div>
            <div class="setting-hint" data-i18n="opt.report.hint"></div>
          </div>
          <div class="tool-btn toggle" id="optReport"></div>
        </div>
        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.reportField"></div>
            <div class="setting-hint" data-i18n="opt.reportField.hint"></div>
          </div>
          <div class="seg" id="fieldRow">
            <div class="seg-btn" data-field="logNote" data-i18n="field.logNote"></div>
            <div class="seg-btn" data-field="description" data-i18n="field.description"></div>
            <div class="seg-btn" data-field="comment" data-i18n="field.comment"></div>
          </div>
        </div>
        <div class="setting-row" data-opt="reportScene">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.reportScene"></div>
            <div class="setting-hint" data-i18n="opt.reportScene.hint"></div>
          </div>
          <div class="tool-btn toggle" id="optReportScene"></div>
        </div>
        <div class="setting-row" data-opt="reportOverwrite">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.reportOverwrite"></div>
            <div class="setting-hint" data-i18n="opt.reportOverwrite.hint"></div>
          </div>
          <div class="tool-btn toggle" id="optReportOverwrite"></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title" data-i18n="sec.panel"></div>
        <div class="setting-row" data-opt="debug">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.debug"></div>
            <div class="setting-hint" data-i18n="opt.debug.hint"></div>
          </div>
          <div class="tool-btn toggle" id="optDebug"></div>
        </div>
        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.lang"></div>
            <div class="setting-hint" data-i18n="opt.lang.hint"></div>
          </div>
          <div class="seg" id="langRow">
            <div class="seg-btn" data-lang="auto" data-i18n="lang.auto"></div>
            <div class="seg-btn" data-lang="en">EN</div>
            <div class="seg-btn" data-lang="de">DE</div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title" data-i18n="sec.about"></div>
        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.updates"></div>
            <div class="setting-hint" id="updateHint"></div>
          </div>
          <div class="seg">
            <div class="seg-btn" id="btnCheckUpdates" data-i18n="btn.checkUpdates"></div>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-label" data-i18n="opt.feedback"></div>
            <div class="setting-hint" data-i18n="opt.feedback.hint"></div>
          </div>
          <div class="seg">
            <div class="seg-btn" id="btnGitHub">GitHub</div>
            <div class="seg-btn" id="btnIssue" data-i18n="btn.issue"></div>
          </div>
        </div>
      </div>
      <div class="made-by">
        <span>made by Mees-Film</span>
        <span><span data-i18n="footer.version"></span> <span id="ver"></span></span>
      </div>
    </div>
  </div>

</div>
<script src="index.js"></script>
</body>
</html>
